
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>соня ♡</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #f8f3ee;
    color: #594943;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 22px;
}

.container {
    width: 100%;
    max-width: 390px;
    text-align: center;
}

.top {
    color: #c58f91;
    font-size: 13px;
    letter-spacing: 5px;
    margin-bottom: 22px;
}

h1 {
    font-size: 42px;
    font-weight: normal;
    margin: 0 0 10px;
    letter-spacing: 2px;
}

.subtitle {
    font-size: 15px;
    color: #a98984;
    margin-bottom: 30px;
}

.photo {
    width: 100%;
    max-height: 440px;
    object-fit: contain;
    border-radius: 18px;
    display: block;
}

.line {
    width: 45px;
    height: 1px;
    background: #d9aaaa;
    margin: 28px auto;
}

.bottom {
    font-size: 17px;
    color: #a77f80;
    font-style: italic;
}

.heart {
    color: #cf969a;
    font-size: 19px;
    margin-top: 25px;
}
</style>
</head>
<body>
<div class="container">
    <div class="top">A LITTLE PLACE FOR YOU</div>
    <h1>соня</h1>
    <div class="subtitle">ты — моё самое любимое</div>

    <img class="photo" src="./photo.jpg" alt="Наше фото">

    <div class="line"></div>
    <div class="bottom">этот маленький мир — о тебе</div>
    <div class="heart">♡</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
</script>
</body>
</html>
